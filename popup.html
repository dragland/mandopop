<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mandopop Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'SF Mono', 'Fira Code', 'Monaco', 'Consolas', monospace;
      width: 280px;
      padding: 16px;
      background: #0d0d0d;
      color: #e8e8e8;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1a1a1a;
    }

    .header img {
      width: 32px;
      height: 32px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #00ff88;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
    }

    .setting {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #1a1a1a;
    }

    .setting:last-child {
      border-bottom: none;
    }

    .setting-label {
      font-size: 13px;
      color: #e8e8e8;
    }

    .setting-description {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }
    .attribution {
      margin-top: 16px;
      font-size: 10px;
      color: #8a8a8a;
      text-align: center;
      line-height: 1.5;
    }
    .attribution a {
      color: #b3b3b3;
      text-decoration: none;
    }
    .attribution a:hover {
      text-decoration: underline;
    }

    /* Toggle Switch */
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #1a1a1a;
      border: 1px solid #2a2a2a;
      transition: 0.2s;
      border-radius: 24px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background-color: #666;
      transition: 0.2s;
      border-radius: 50%;
    }

    .toggle input:checked + .toggle-slider {
      background-color: #0a3d2a;
      border-color: #00ff88;
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
    }

    .toggle input:checked + .toggle-slider:before {
      transform: translateX(20px);
      background-color: #00ff88;
      box-shadow: 0 0 6px rgba(0, 255, 136, 0.5);
    }

    /* Font Size Slider */
    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 4px;
      background: #1a1a1a;
      border-radius: 2px;
      outline: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: #00ff88;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0, 255, 136, 0.5);
    }

    .slider-value {
      font-size: 11px;
      color: #00d4ff;
      min-width: 32px;
      text-align: right;
      text-shadow: 0 0 6px rgba(0, 212, 255, 0.3);
    }

    .preview {
      margin-top: 16px;
      padding: 12px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 8px;
      text-align: center;
    }

    .preview-chinese {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
      font-weight: 600;
      color: #00ff88;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
      margin-bottom: 4px;
    }

    .preview-pinyin {
      font-size: 14px;
      color: #00d4ff;
      font-style: italic;
      text-shadow: 0 0 8px rgba(0, 212, 255, 0.3);
    }

    /* Traverse */
    .traverse {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #1a1a1a;
    }

    .traverse-title {
      font-size: 12px;
      font-weight: 600;
      color: #e8e8e8;
      margin-bottom: 8px;
    }

    .traverse input[type="email"],
    .traverse input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 8px;
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #e8e8e8;
      font-family: inherit;
      font-size: 12px;
    }

    .traverse input:focus {
      outline: none;
      border-color: #00ff88;
    }

    .traverse-btn {
      padding: 7px 12px;
      background: #0a3d2a;
      border: 1px solid #00ff88;
      border-radius: 6px;
      color: #00ff88;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .traverse-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .traverse-btn.traverse-btn-quiet {
      background: transparent;
      border-color: #2a2a2a;
      color: #999999;
    }

    .traverse-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .traverse-status {
      font-size: 11px;
      color: #8a8a8a;
      line-height: 1.5;
    }

    .traverse-error {
      font-size: 11px;
      color: #ff5f56;
      line-height: 1.5;
      margin-top: 6px;
      word-break: break-word;
    }

    .traverse-error:empty {
      display: none;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Mandopop">
    <h1>Mandopop</h1>
  </div>

  <div class="setting">
    <div>
      <div class="setting-label">Pronunciation</div>
      <div class="setting-description">Add a button to hear the word spoken</div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="showAudio">
      <span class="toggle-slider"></span>
    </label>
  </div>

  <div class="setting">
    <div>
      <div class="setting-label">Hanzi size</div>
      <div class="setting-description">Size of the characters shown</div>
    </div>
    <div class="slider-container">
      <input type="range" class="slider" id="fontSize" min="16" max="36" step="2">
      <span class="slider-value" id="fontSizeValue">24px</span>
    </div>
  </div>

  <div class="preview">
    <div class="preview-chinese" id="previewChinese">你好</div>
    <div class="preview-pinyin">nǐ hǎo</div>
  </div>

  <div class="traverse">
    <div class="traverse-title">Traverse</div>

    <form id="signInForm" hidden>
      <input type="email" id="traverseEmail" placeholder="email" autocomplete="username" required>
      <input type="password" id="traversePassword" placeholder="password" autocomplete="current-password" required>
      <div class="traverse-actions">
        <button type="submit" class="traverse-btn" id="signInBtn">Sign in</button>
      </div>
    </form>

    <div id="traverseAccount" hidden>
      <div class="traverse-status" id="traverseStatus"></div>

      <div class="setting">
        <div>
          <div class="setting-label">Chinglish</div>
          <div class="setting-description">Swap English words you know for their hanzi while browsing</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="chinglish">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="traverse-actions">
        <button type="button" class="traverse-btn traverse-btn-quiet" id="signOutBtn">Sign out</button>
        <button type="button" class="traverse-btn" id="syncBtn">Sync now</button>
      </div>
    </div>

    <div class="traverse-error" id="traverseError"></div>
  </div>

  <div class="attribution">
    Dictionary data:
    <a href="https://www.mdbg.net/chinese/dictionary?page=cc-cedict" target="_blank" rel="noopener">CC-CEDICT</a>,
    licensed under
    <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
